# Hanzo CI/CD for luxfi/safe-wallet: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: safe
    context: .
    dockerfile: Dockerfile.lux
    repo: ghcr.io/luxfi/safe
    platforms: [linux/amd64]
